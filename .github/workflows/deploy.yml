# ── CI/CD: Deploy to Cloudflare Workers ──────────────────────────
# Se dispara en cada push a main o manualmente desde GitHub Actions.
# Requiere dos secrets en el repo:
#   CF_API_TOKEN   → API token de Cloudflare (permisos Workers)
#   CF_ACCOUNT_ID  → Account ID de Cloudflare
# ──────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite lanzar el deploy manualmente

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Deploy con Wrangler
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # account_id ya está definido en wrangler.toml — no necesita secret
