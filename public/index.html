<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Juego del Ahorcado en español — 100 palabras con pistas, categorías y dificultad">
  <meta name="theme-color" content="#0d1117">
  <title>🎭 Ahorcado</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header id="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🎭</span>
        <h1 class="brand-title">AHORCADO</h1>
        <span class="brand-lang">· Español ·</span>
      </div>
      <div id="marcador" class="marcador" aria-label="Marcador de victorias y derrotas">
        <div class="stat">
          <span class="stat-label win" aria-hidden="true">✔</span>
          <span class="stat-num" id="victorias">0</span>
        </div>
        <span class="stat-divider" aria-hidden="true">│</span>
        <div class="stat">
          <span class="stat-label lose" aria-hidden="true">✘</span>
          <span class="stat-num" id="derrotas">0</span>
        </div>
      </div>
    </header>

    <!-- ── Filters ──────────────────────────────────────────────── -->
    <section id="filtros" aria-label="Filtros de juego">

      <!-- Category row — pills generated by JS -->
      <div class="filtro-fila">
        <span class="filtro-etiqueta" id="lbl-cat">Categoría</span>
        <div id="filtro-cat"
             class="filtro-pills"
             role="group"
             aria-labelledby="lbl-cat"></div>
      </div>

      <!-- Difficulty row — static pills -->
      <div class="filtro-fila">
        <span class="filtro-etiqueta" id="lbl-dif">Dificultad</span>
        <div id="filtro-dif"
             class="filtro-pills"
             role="group"
             aria-labelledby="lbl-dif">
          <button class="pill active" data-dif="todas"   aria-pressed="true" >Todas</button>
          <button class="pill"        data-dif="facil"   aria-pressed="false">🌱&thinsp;Fácil</button>
          <button class="pill"        data-dif="normal"  aria-pressed="false">⚡&thinsp;Normal</button>
          <button class="pill pill-hard" data-dif="dificil" aria-pressed="false">💀&thinsp;Difícil</button>
        </div>
      </div>

      <!-- Pool count badge -->
      <p id="pool-count" class="pool-count" aria-live="polite" aria-atomic="true"></p>

    </section>

    <!-- ── Game board ────────────────────────────────────────────── -->
    <main id="tablero" aria-label="Tablero de juego">

      <!-- Gallows + Lives -->
      <section class="col-horca" aria-label="Estado del ahorcado">
        <div class="horca-frame">
          <svg id="hangman-svg"
               viewBox="0 0 200 280"
               xmlns="http://www.w3.org/2000/svg"
               aria-hidden="true"
               focusable="false">
            <g class="gallows" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line class="g-base" x1="10"  y1="270" x2="190" y2="270" pathLength="100"/>
              <line class="g-pole" x1="50"  y1="268" x2="50"  y2="20"  pathLength="100"/>
              <line class="g-beam" x1="49"  y1="20"  x2="150" y2="20"  pathLength="100"/>
              <line class="g-rope" x1="150" y1="20"  x2="150" y2="55"  pathLength="100"/>
            </g>
            <g class="figure" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle id="p-head" class="bp" cx="150" cy="75"  r="20"  pathLength="100"/>
              <line   id="p-body" class="bp" x1="150" y1="95"  x2="150" y2="165" pathLength="100"/>
              <line   id="p-arl"  class="bp" x1="150" y1="115" x2="108" y2="143" pathLength="100"/>
              <line   id="p-arr"  class="bp" x1="150" y1="115" x2="192" y2="143" pathLength="100"/>
              <line   id="p-legl" class="bp" x1="150" y1="165" x2="108" y2="215" pathLength="100"/>
              <line   id="p-legr" class="bp" x1="150" y1="165" x2="192" y2="215" pathLength="100"/>
            </g>
          </svg>
        </div>
        <div id="vidas-bar" class="vidas-bar" role="img" aria-label="Vidas restantes"></div>
        <p id="sr-estado" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      </section>

      <!-- Word + info -->
      <section class="col-info" aria-label="Información de la palabra">
        <div class="meta-row">
          <span id="categoria-display" class="badge-categoria"></span>
          <span id="dificultad-display" class="badge-dificultad"></span>
          <span id="longitud-display"  class="longitud-texto"></span>
        </div>

        <div id="palabra-display"
             class="palabra-display"
             role="group"
             aria-label="Letras de la palabra"></div>

        <div id="pista-area" class="pista-area"></div>
      </section>

    </main>

    <!-- ── Virtual keyboard ──────────────────────────────────────── -->
    <div id="teclado"
         class="teclado"
         role="group"
         aria-label="Teclado de letras"></div>

    <!-- ── Result overlay ────────────────────────────────────────── -->
    <div id="overlay"
         class="overlay"
         hidden
         role="dialog"
         aria-modal="true"
         aria-labelledby="overlay-titulo">
      <div class="overlay-card" id="overlay-card">
        <div class="overlay-emoji" id="overlay-emoji" aria-hidden="true"></div>
        <h2  class="overlay-titulo"  id="overlay-titulo"></h2>
        <p   class="overlay-palabra" id="overlay-palabra"></p>
        <p   class="overlay-pista"   id="overlay-pista"></p>
        <button id="btn-reiniciar" class="btn-restart" autofocus>
          ↺&ensp;Jugar de nuevo
        </button>
      </div>
    </div>

  </div><!-- /#app -->

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="game.js"></script>
</body>
</html>
